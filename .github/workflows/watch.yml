name: watch

# The unattended runs push to main on their own. If nothing has been pushed for 30 hours the machine has stopped or its
# check keeps failing: this job fails, and GitHub sends the failure by e-mail to the owner of the repository.
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

jobs:
  watch:
    # to stop the mails while the machine is off on purpose: set the repository variable WATCH to off
    if: vars.WATCH != 'off'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - run: |
          last=$(git log -1 --format=%ct)
          age=$(( ($(date +%s) - last) / 3600 ))
          echo "last commit on main: $age hours ago"
          [ "$age" -lt 30 ]
